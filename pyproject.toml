[project]
name = "imagex"
version = "0.1.0"
description = "Inspect Docker image tars without running them: packages, layers and known CVEs."
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "rich>=13,<15"]

[project.scripts]
imagex = "imagex.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["imagex"]
